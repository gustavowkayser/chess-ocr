[project]
name = "chess-ocr"
version = "0.1.0"
description = "Page-level OCR for chess books with real Unicode figurines, fine-tuned with QLoRA."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Gustavo Kayser" }]
dependencies = []

[project.scripts]
chess-ocr = "chess_ocr.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.8",
]
# Heavy CUDA stack. Installed by default locally; CI opts out with --no-group gpu.
gpu = [
    "torch>=2.15",
    "transformers>=4.50",
    "peft>=0.15",
    "accelerate>=1.5",
    "bitsandbytes>=0.50",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "gpu"]
# Only Windows (dev machine) and Linux (CI, WSL2 fallback) are supported.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# Blackwell (sm_120) needs CUDA >= 12.8. cu132 matches the dev driver (CUDA 13.2).
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU; skipped unless --run-gpu is passed",
]
